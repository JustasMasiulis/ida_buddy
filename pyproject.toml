[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ida-buddy"
version = "0.1.0"
description = "windbg-flavored CLI over the official IDA Code Mode RPC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JustasMasiulis" }]
dependencies = ["ida-codemode>=0.3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
idb = "idb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
prerelease = "allow"
